<!DOCTYPE html>
<html lang="en" class="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="fourdoorai call agent — AI-powered sales coaching platform that analyzes call recordings for transcription, sentiment, and actionable coaching insights.">
    <meta name="theme-color" content="#1e293b" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta property="og:type" content="website">
    <meta property="og:title" content="fourdoorai call agent — Sales Coaching Intelligence">
    <meta property="og:description" content="Analyze sales calls with AI. Get transcripts, sentiment analysis, and actionable coaching feedback instantly.">
    <title>fourdoorai call agent</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;1,14..32,400&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50:  '#f0fdf9',
                            100: '#ccfbef',
                            200: '#99f6df',
                            300: '#5eedc8',
                            400: '#2dd4aa',
                            500: '#10b98b',
                            600: '#059571',
                            700: '#04785b',
                            800: '#065f49',
                            900: '#074d3d',
                        },
                    },
                    animation: {
                        'fade-in':    'fadeIn 0.4s ease-out both',
                        'slide-up':   'slideUp 0.4s ease-out both',
                        'slide-down': 'slideDown 0.3s ease-out both',
                        'shimmer':    'shimmer 1.6s infinite linear',
                        'pulse-dot':  'pulseDot 1.5s ease-in-out infinite',
                        'bounce-in':  'bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) both',
                        'spin-slow':  'spin 3s linear infinite',
                    },
                    keyframes: {
                        fadeIn:    { from: { opacity: '0' },                to: { opacity: '1' } },
                        slideUp:   { from: { opacity: '0', transform: 'translateY(12px)' }, to: { opacity: '1', transform: 'translateY(0)' } },
                        slideDown: { from: { opacity: '0', transform: 'translateY(-8px)' }, to: { opacity: '1', transform: 'translateY(0)' } },
                        shimmer:   { from: { backgroundPosition: '-200% 0' }, to: { backgroundPosition: '200% 0' } },
                        pulseDot:  { '0%, 100%': { transform: 'scale(1)', opacity: '1' }, '50%': { transform: 'scale(1.3)', opacity: '0.7' } },
                        bounceIn:  { from: { opacity: '0', transform: 'scale(0.8)' }, to: { opacity: '1', transform: 'scale(1)' } },
                    },
                    boxShadow: {
                        'glow-indigo':  '0 0 20px rgba(99, 102, 241, 0.3)',
                        'glow-emerald': '0 0 20px rgba(16, 185, 129, 0.3)',
                        'glow-violet':  '0 0 20px rgba(139, 92, 246, 0.3)',
                        'card':  '0 4px 24px rgba(15, 23, 42, 0.07)',
                        'card-hover': '0 8px 40px rgba(15, 23, 42, 0.12)',
                    },
                    backgroundImage: {
                        'shimmer-gradient': 'linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.15) 50%, transparent 100%)',
                        'gradient-radial':  'radial-gradient(var(--tw-gradient-stops))',
                    },
                },
            },
        }
    </script>

    <style>
        /* ─── CSS Custom Properties ─────────────────────────────────── */
        :root {
            --sidebar-width: 16rem;
            --header-height: 5rem;
            --ui-radius: 0.75rem;
            --transition-base: 200ms cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ─── Base Reset & Typography ───────────────────────────────── */
        html, body, #root { height: 100%; }
        body {
            font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        /* ─── Scrollbar ─────────────────────────────────────────────── */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 99px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .dark ::-webkit-scrollbar-thumb { background: #334155; }
        .dark ::-webkit-scrollbar-thumb:hover { background: #475569; }
        * { scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent; }
        .dark * { scrollbar-color: #334155 transparent; }

        /* ─── Slider Thumbs ─────────────────────────────────────────── */
        input[type="range"] { -webkit-appearance: none; appearance: none; }
        input[type="range"]::-webkit-slider-runnable-track {
            height: 6px; border-radius: 99px;
            background: linear-gradient(to right, currentColor var(--value, 50%), #e2e8f0 var(--value, 50%));
        }
        .dark input[type="range"]::-webkit-slider-runnable-track { background: #334155; }
        .slider-thumb-red::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 18px; height: 18px; margin-top: -6px;
            background: #ef4444; cursor: pointer; border-radius: 50%;
            border: 2px solid white; box-shadow: 0 1px 4px rgba(239,68,68,0.5);
            transition: transform 150ms ease, box-shadow 150ms ease;
        }
        .slider-thumb-red::-webkit-slider-thumb:hover { transform: scale(1.15); box-shadow: 0 0 0 4px rgba(239,68,68,0.2); }
        .slider-thumb-red::-moz-range-thumb { width: 16px; height: 16px; background: #ef4444; cursor: pointer; border-radius: 50%; border: 2px solid white; }
        .slider-thumb-green::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 18px; height: 18px; margin-top: -6px;
            background: #22c55e; cursor: pointer; border-radius: 50%;
            border: 2px solid white; box-shadow: 0 1px 4px rgba(34,197,94,0.5);
            transition: transform 150ms ease, box-shadow 150ms ease;
        }
        .slider-thumb-green::-webkit-slider-thumb:hover { transform: scale(1.15); box-shadow: 0 0 0 4px rgba(34,197,94,0.2); }
        .slider-thumb-green::-moz-range-thumb { width: 16px; height: 16px; background: #22c55e; cursor: pointer; border-radius: 50%; border: 2px solid white; }

        /* ─── Card Component ─────────────────────────────────────────── */
        .card {
            background: white;
            border-radius: var(--ui-radius);
            box-shadow: 0 4px 24px rgba(15, 23, 42, 0.07);
            transition: box-shadow var(--transition-base);
        }
        .card:hover { box-shadow: 0 8px 40px rgba(15, 23, 42, 0.12); }
        .dark .card { background: #1e293b; box-shadow: 0 4px 24px rgba(0, 0, 0, 0.2); }
        .dark .card:hover { box-shadow: 0 8px 40px rgba(0, 0, 0, 0.3); }

        /* ─── Shimmer Loading Effect ─────────────────────────────────── */
        .shimmer {
            background: linear-gradient(90deg, #f1f5f9 0%, #e2e8f0 50%, #f1f5f9 100%);
            background-size: 200% 100%;
            animation: shimmer 1.6s infinite linear;
        }
        @keyframes shimmer { from { background-position: -200% 0; } to { background-position: 200% 0; } }
        .dark .shimmer {
            background: linear-gradient(90deg, #1e293b 0%, #293548 50%, #1e293b 100%);
            background-size: 200% 100%;
        }

        /* ─── Focus Rings ────────────────────────────────────────────── */
        :focus-visible {
            outline: 2px solid #6366f1;
            outline-offset: 2px;
            border-radius: 4px;
        }
        .dark :focus-visible { outline-color: #818cf8; }

        /* ─── Gradient Text ──────────────────────────────────────────── */
        .gradient-text {
            background: linear-gradient(135deg, #6366f1, #8b5cf6, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ─── Upload Drop Zone ───────────────────────────────────────── */
        .drop-zone-active {
            border-color: #6366f1 !important;
            background: rgba(99, 102, 241, 0.06) !important;
            transform: scale(1.01);
        }

        /* ─── Glass Effect ───────────────────────────────────────────── */
        .glass {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .dark .glass {
            background: rgba(30, 41, 59, 0.75);
            border-color: rgba(255, 255, 255, 0.08);
        }

        /* ─── Responsive ─────────────────────────────────────────────── */
        @media (max-width: 640px) { :root { --sidebar-width: 100%; } }

        /* ─── Sidebar Gradient ───────────────────────────────────────── */
        .sidebar-bg {
            background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
        }

        /* ─── Line clamp ─────────────────────────────────────────────── */
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    </style>

    <script type="importmap">
    {
      "imports": {
        "recharts": "https://aistudiocdn.com/recharts@^3.4.1",
        "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
        "react": "https://aistudiocdn.com/react@^19.2.0",
        "react/": "https://aistudiocdn.com/react@^19.2.0/",
        "@google/genai": "https://aistudiocdn.com/@google/genai@^1.29.0",
        "framer-motion": "https://aistudiocdn.com/framer-motion@^11.3.11",
        "flags/": "https://aistudiocdn.com/flags@^4.0.2/",
        "@flags-sdk/statsig": "https://aistudiocdn.com/@flags-sdk/statsig@^0.2.5",
        "@statsig/react-bindings": "https://aistudiocdn.com/@statsig/react-bindings@^1.2.0",
        "@statsig/web-analytics": "https://aistudiocdn.com/@statsig/web-analytics@^1.1.0",
        "@statsig/session-replay": "https://aistudiocdn.com/@statsig/session-replay@^1.1.0"
      }
    }
    </script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-200 antialiased min-h-screen flex flex-col transition-colors duration-300">
    <div id="root" class="flex-grow flex w-full"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
